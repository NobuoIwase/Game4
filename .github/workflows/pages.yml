name: Deploy to GitHub Pages
# ゲームファイル(index.html + js/)だけを gh-pages ブランチへ反映する。
# Pages は gh-pages ブランチをソースとして配信される。
on:
  push:
    branches:
      - claude/vampire-survivor-game-test-vyy7e1
      - claude/ai-girl-deck-battle-game-1k94l5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish game files to gh-pages
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r js _site/js
          if [ -d assets ]; then cp -r assets _site/assets; fi
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
