name: Build generated asset manifest

on:
  push:
    paths:
      - 'assets/generated/**'
      - 'tools/rebuild_asset_manifest.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rebuild manifest
        run: python tools/rebuild_asset_manifest.py
      - name: Commit manifest when changed
        run: |
          if git diff --quiet -- assets/generated/manifest.json; then
            echo "No manifest changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/manifest.json
          git commit -m "Rebuild generated asset manifest"
          git push
