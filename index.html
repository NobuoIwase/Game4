<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ルミナ・サバイバーズ — 侵蝕デッキ</title>
<style>
:root{
  --ink:#0b0c19; --panel:rgba(17,15,34,.94); --line:rgba(150,130,255,.38);
  --gold:#ffd76a; --blue:#8fd3ff; --pink:#ff86b3; --body:#cdd3ef; --dim:#7b82a8;
  --vio:#b46cff; --vio2:#7a3ff2; --red:#ff5d7a; --green:#7ee89a;
  --card:#191430; --card-line:rgba(160,120,255,.35);
}
html,body{height:100%;}
body{
  margin:0; background:var(--ink); color:#fff; overflow:hidden;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  -webkit-user-select:none; user-select:none;
}
#stage{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(1200px 700px at 50% 40%, #151230, #08060f);
}
canvas#cv{ border-radius:8px; box-shadow:0 0 44px rgba(120,80,255,.16); }
#mute{
  position:absolute; top:10px; right:14px; font-size:20px; cursor:pointer;
  opacity:.72; z-index:40; line-height:1;
}
[hidden]{ display:none !important; }

/* ===== 汎用UI ===== */
button{
  font-family:inherit; font-size:14px; font-weight:bold; color:#fff;
  background:linear-gradient(180deg,#a678ff,#7a3ff2); border:none; border-radius:12px;
  padding:10px 22px; cursor:pointer; box-shadow:0 4px 14px rgba(140,90,255,.35);
  transition:transform .1s;
}
button:hover{ transform:scale(1.04); }
button:disabled{ opacity:.38; cursor:default; transform:none; box-shadow:none; }
button.sub{ background:linear-gradient(180deg,#3a3658,#262242); font-weight:normal; font-size:12px; padding:8px 16px; }
button.gold{ background:linear-gradient(180deg,#ffd76a,#e8a53a); color:#3a2a10; }
button:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }

/* ===== スクリーン(DOMオーバーレイ) ===== */
#screens{ position:absolute; inset:0; z-index:20; pointer-events:none; }
.screen{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; pointer-events:auto; overflow:auto; padding:14px 0;
}
.screen .inner{
  background:var(--panel); border:2px solid var(--line); border-radius:18px;
  padding:20px 26px; max-width:min(860px,94vw); margin:auto;
  box-shadow:0 10px 40px rgba(0,0,0,.6);
}
.screen .inner.wide{ width:min(860px,94vw); }
.screen h1{
  margin:0 0 2px; font-size:26px; letter-spacing:2px; text-align:center;
  background:linear-gradient(180deg,#ffffff 20%,var(--vio));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.screen h2{ margin:0 0 10px; font-size:19px; color:#e7dcff; }
.screen .sub{ color:var(--blue); font-size:11px; letter-spacing:3px; text-align:center; margin-bottom:10px; }
.screen p{ font-size:12.5px; line-height:1.85; color:var(--body); margin:6px 0 10px; }
.note{ font-size:11px; color:var(--dim); margin-top:8px; line-height:1.7; }
.row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; }
.spread{ display:flex; justify-content:space-between; align-items:center; gap:12px; }

/* リソースバー */
#resbar{
  position:absolute; top:10px; left:14px; z-index:30; display:flex; gap:8px;
  font-size:12px; font-weight:bold; pointer-events:none;
}
#resbar .chip{
  background:rgba(20,16,40,.85); border:1.4px solid var(--card-line);
  border-radius:999px; padding:5px 12px; color:#e7dcff;
}
#resbar .chip b{ color:var(--gold); }
#resbar .chip.orb b{ color:var(--vio); }

/* メニューカードグリッド */
.menu-grid{ display:grid; grid-template-columns:repeat(2,minmax(180px,1fr)); gap:10px; margin:12px 0 6px; }
.menu-grid button{ padding:14px 10px; font-size:15px; }
.menu-grid button small{ display:block; font-size:10px; font-weight:normal; opacity:.75; margin-top:3px; }

/* カード(モンスター) */
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin:10px 0; }
.mcard{
  background:var(--card); border:1.6px solid var(--card-line); border-radius:14px;
  padding:10px; text-align:center; position:relative; transition:border-color .12s;
}
.mcard.sel{ border-color:var(--gold); box-shadow:0 0 12px rgba(255,215,106,.25); }
.mcard.locked{ opacity:.55; }
.mcard .nm{ font-weight:bold; font-size:13px; margin:4px 0 2px; }
.mcard .st{ font-size:10.5px; color:var(--dim); line-height:1.6; }
.mcard .cost{
  position:absolute; top:6px; left:6px; background:var(--vio2); border-radius:999px;
  font-size:11px; font-weight:bold; padding:2px 8px;
}
.mcard .lv{
  position:absolute; top:6px; right:6px; color:var(--gold);
  font-size:10px; font-weight:bold;
}
.mcard canvas{ image-rendering:auto; }
.mcard .act{ margin-top:6px; }
.mcard .act button{ font-size:11px; padding:5px 12px; border-radius:9px; }

/* 祭壇・研究の行 */
.list{ display:flex; flex-direction:column; gap:8px; margin:10px 0; }
.lrow{
  display:flex; align-items:center; gap:12px; background:var(--card);
  border:1.4px solid var(--card-line); border-radius:12px; padding:9px 14px;
}
.lrow .info{ flex:1; text-align:left; }
.lrow .nm{ font-weight:bold; font-size:13px; }
.lrow .ds{ font-size:10.5px; color:var(--dim); line-height:1.55; }
.pips{ display:inline-flex; gap:3px; margin-left:8px; vertical-align:1px; }
.pips i{ width:8px; height:8px; border-radius:50%; background:#2c2750; border:1px solid var(--card-line); }
.pips i.on{ background:var(--vio); box-shadow:0 0 5px var(--vio); }

/* ステータス画面 */
.stcard{
  background:var(--card); border:1.4px solid var(--card-line); border-radius:12px;
  padding:10px 14px; margin-bottom:9px; text-align:left;
}
.stcard h3{ margin:0 0 6px; font-size:12.5px; color:var(--vio); letter-spacing:1px; }
.stcard .kv{ display:flex; flex-wrap:wrap; gap:5px 16px; font-size:12px; }
.stcard .kv span{ color:var(--dim); font-size:11px; }
.bar{ height:9px; background:#241f45; border-radius:5px; overflow:hidden; margin:3px 0 1px; }
.bar i{ display:block; height:100%; border-radius:5px; }
.stagename{ font-size:11px; color:var(--gold); font-weight:bold; }

/* ===== 戦闘HUD(下部バー) ===== */
#battlebar{
  position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
  z-index:25; display:flex; flex-direction:column; gap:6px; align-items:center;
  pointer-events:auto;
}
#enwrap{ display:flex; align-items:center; gap:8px; width:100%; }
#enbar{
  flex:1; height:14px; background:rgba(20,16,40,.85); border:1.4px solid var(--card-line);
  border-radius:8px; overflow:hidden; position:relative;
}
#enfill{ height:100%; width:0%; background:linear-gradient(90deg,#7a3ff2,#c98cff); transition:width .12s; }
#entext{ font-size:11px; font-weight:bold; color:#e7dcff; min-width:64px; text-align:right; }
#handrow{ display:flex; gap:7px; align-items:flex-end; flex-wrap:wrap; justify-content:center; }
#itemrow{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
.ichip{ position:relative; overflow:hidden; font-size:10.5px; padding:4px 10px; border-radius:999px; background:rgba(22,17,44,.92); border:1.4px solid var(--card-line); color:#d9d3f5; cursor:pointer; user-select:none; }
.ichip b{ color:var(--vio); font-weight:bold; }
.ichip .icd{ position:absolute; left:0; bottom:0; height:100%; background:rgba(120,80,255,.28); z-index:0; pointer-events:none; }
.ichip span{ position:relative; z-index:1; }
.ichip.off{ opacity:.45; cursor:default; }
.ichip.sel{ border-color:var(--gold); box-shadow:0 0 10px rgba(255,215,106,.35); color:#fff; }
canvas#cv.arm{ cursor:crosshair; }
.hcard{
  width:66px; height:84px; border-radius:11px; background:rgba(22,17,44,.92);
  border:1.6px solid var(--card-line); cursor:pointer; position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  padding-bottom:4px; transition:transform .1s, border-color .1s; overflow:hidden;
}
.hcard:hover{ transform:translateY(-4px); }
.hcard.sel{ border-color:var(--gold); box-shadow:0 0 14px rgba(255,215,106,.35); transform:translateY(-6px); }
.hcard.off{ opacity:.42; cursor:default; transform:none; }
.hcard .nm{ font-size:9px; font-weight:bold; color:#d9d3f5; z-index:2; }
.hcard .cost{
  position:absolute; top:3px; left:3px; z-index:2; background:var(--vio2);
  border-radius:999px; font-size:10px; font-weight:bold; padding:1px 6px;
}
.hcard canvas{ position:absolute; top:6px; left:50%; transform:translateX(-50%); }
.hcard .cd{
  position:absolute; left:0; bottom:0; width:100%; background:rgba(8,6,18,.72);
  z-index:3; pointer-events:none;
}
.hcard .combo{
  position:absolute; top:3px; right:3px; z-index:4; background:#ffd76a; color:#241c08;
  border-radius:999px; font-size:9px; font-weight:bold; padding:1px 5px; pointer-events:none;
}
.hcard .cnt{
  position:absolute; bottom:17px; right:3px; z-index:2; color:#ffd76a;
  font-size:8.5px; font-weight:bold; text-shadow:0 1px 2px rgba(0,0,0,.8); pointer-events:none;
}
#formrow{ display:flex; gap:6px; }
.fchip{
  font-size:10.5px; font-weight:bold; color:#cbc2ee; background:rgba(22,17,44,.9);
  border:1.4px solid var(--card-line); border-radius:999px; padding:4px 11px; cursor:pointer;
}
.fchip.sel{ color:#fff; background:var(--vio2); border-color:var(--vio); }
.fchip .fc{ opacity:.8; font-weight:normal; }
#battlebar .side{ display:flex; gap:6px; }
#battlebar .side button{ font-size:10.5px; padding:5px 12px; border-radius:999px; }
#battlebar .side button.on{ background:linear-gradient(180deg,#ffd76a,#e8a53a); color:#3a2a10; }

/* 結果パネル内の内訳 */
.breakdown{ font-size:12.5px; line-height:2; color:#e8ebff; text-align:left; margin:8px auto; display:table; }
.breakdown b{ color:var(--gold); }
.breakdown .o b{ color:var(--vio); }
#sceneBox{
  background:#141024; border:1.4px solid var(--card-line); border-radius:10px;
  max-height:180px; overflow:auto; padding:10px 14px; font-size:12px; line-height:1.9;
  color:#cfc8ea; text-align:left; white-space:pre-wrap; margin:8px 0;
}
.newbadge{ color:var(--pink); font-weight:bold; font-size:12px; }
/* v1.1: 図鑑・観測記録(読み物) */
.codex-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; margin:10px 0; }
.ccard{ background:var(--card); border:1.6px solid var(--card-line); border-radius:12px; padding:8px 6px; text-align:center; cursor:pointer; position:relative; }
.ccard:hover{ border-color:var(--vio); }
.ccard .nm{ font-weight:bold; font-size:12px; margin-top:3px; }
.ccard .st{ font-size:10px; color:var(--dim); }
.ccard.unknown{ opacity:.5; }
.ccard .stg{ position:absolute; right:6px; top:6px; font-size:9.5px; color:var(--pink); }
.notebook{ background:#f3ead6; color:#3a2f2a; border-radius:6px; padding:16px 18px; margin:10px 0; font-size:13px; line-height:1.95; text-align:left;
  box-shadow:inset 0 0 40px rgba(120,90,40,.15), 0 2px 8px rgba(0,0,0,.35); font-family:"Klee One","Yu Kyokasho","YuKyokasho","Hiragino Maru Gothic ProN","Yu Gothic UI",serif;
  background-image:repeating-linear-gradient(transparent 0 27px, rgba(120,90,40,.16) 27px 28px); }
.notebook h4{ margin:0 0 8px; font-size:13.5px; color:#5a3a2a; border-bottom:1px dashed rgba(90,60,40,.45); padding-bottom:4px; }
.notebook .entry{ margin:10px 0 0; padding-top:6px; }
.notebook .entry .lbl{ display:inline-block; font-size:11px; color:#8a4a4a; border:1px solid rgba(138,74,74,.6); border-radius:4px; padding:0 6px; margin-bottom:4px; }
.notebook s{ color:#9a6a6a; text-decoration:line-through; text-decoration-color:#7a3a3a; }
.notebook .shaky{ display:inline-block; transform:rotate(-1.2deg) skewX(-6deg); letter-spacing:.06em; color:#6a2a3a; }
.notebook .margin{ font-size:11px; color:#8a4a5a; margin:2px 0 2px 18px; padding-left:8px; border-left:2px solid rgba(138,74,90,.5); font-style:italic; }
.notebook .locked{ color:#9a8a7a; font-size:11.5px; font-style:italic; }
.notebook .after{ margin-top:10px; padding-top:8px; border-top:1px dashed rgba(90,60,40,.45); color:#4a3a4a; font-size:12px; font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif; }
.notebook .cut{ color:#7a3a3a; }
.tcard{ border-left:3px solid var(--gold); padding:4px 10px; margin:6px 0; text-align:left; }
.tcard.ero{ border-left-color:var(--pink); }
.tcard .tn{ font-weight:bold; font-size:13px; }
.tcard .tn small{ font-weight:normal; color:var(--dim); margin-left:6px; }
.tcard .td{ font-size:11.5px; color:var(--body); line-height:1.6; }
.tcard .tc{ font-size:10.5px; color:var(--dim); }
.divider{ text-align:center; color:var(--pink); font-size:11.5px; margin:10px 0 4px; letter-spacing:1px; }
.review{ font-size:12.5px; line-height:1.9; text-align:left; color:#e8ebff; }
.review p{ margin:6px 0; }
.selfeval{ font-size:12.5px; line-height:1.95; text-align:left; color:#ffd9e6; }
.selfeval p{ margin:4px 0; }
.heart{ font-size:11.5px; color:var(--dim); font-style:italic; margin-top:6px; }
/* v1.0: 階級と客カード */
.t-fodder{ --tc:#8fd36a; } .t-mid{ --tc:#8fd3ff; } .t-large{ --tc:#c98cff; } .t-boss{ --tc:#ff6b81; }
.hcard .tg{ position:absolute; right:3px; top:3px; z-index:2; font-size:8px; font-weight:bold; line-height:1; padding:2px 3px; border-radius:5px; background:rgba(10,10,26,.75); color:var(--tc,#ccc); border:1px solid var(--tc,#666); }
.hcard.temp{ border-style:dashed; border-color:#c98cff; box-shadow:0 0 10px rgba(201,140,255,.35); }
.hcard.temp .tg{ color:#c98cff; border-color:#c98cff; }
.mcard.empty{ opacity:.5; border-style:dashed; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:120px; cursor:default; }
.tier-h{ border-left:3px solid var(--tc,#888); padding-left:8px; margin-top:14px; }
.tierlbl{ font-size:9.5px; font-weight:normal; padding:1px 6px; border-radius:999px; border:1px solid var(--tc,#888); color:var(--tc,#ccc); vertical-align:middle; }
@media (prefers-reduced-motion: reduce){ button,.hcard{ transition:none; } }

/* ===== モバイル(縦持ち)調整 ===== */
#handrow{ flex-wrap:wrap; justify-content:center; }
#formrow{ flex-wrap:wrap; justify-content:center; }
#battlebar .spread{ flex-wrap:wrap; justify-content:center; row-gap:4px; }
@media (max-width:720px){
  #resbar{ gap:5px; font-size:10.5px; right:48px; flex-wrap:wrap; }
  #resbar .chip{ padding:3px 9px; }
  .hcard{ width:56px; height:74px; }
  .hcard .nm{ font-size:8px; }
  .hcard canvas{ top:3px; }
  .fchip{ padding:3px 9px; font-size:9.5px; }
  #battlebar{ gap:4px; bottom:4px; }
  #battlebar .side button{ font-size:9.5px; padding:4px 9px; }
  #entext{ font-size:10px; min-width:54px; }
  .menu-grid{ grid-template-columns:1fr; }
  .screen .inner{ padding:14px 14px; }
  .cards{ grid-template-columns:repeat(auto-fill,minmax(124px,1fr)); }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="mute" title="サウンド切替">🔊</div>
  <div id="resbar" hidden>
    <div class="chip">✦ エッセンス <b id="resEss">0</b></div>
    <div class="chip orb">◉ オーブ <b id="resOrb">0</b></div>
    <div class="chip">世代 <b id="resGen">Ⅰ</b> <span id="resRot" style="color:var(--dim)"></span></div>
  </div>
  <div id="battlebar" hidden>
    <div id="enwrap">
      <div id="enbar"><div id="enfill"></div></div>
      <div id="entext">EN 0/10</div>
    </div>
    <div id="handrow"></div>
    <div id="itemrow" title="夜側のアイテム: 選んでから画面をタップして置く"></div>
    <div class="spread" style="width:100%">
      <div id="formrow"></div>
      <div class="side">
        <button id="btnAuto" class="sub">AUTO</button>
        <button id="btnSpd" class="sub">▶ ×1</button>
        <button id="btnRetreat" class="sub">撤退</button>
      </div>
    </div>
  </div>
  <div id="screens"></div>
</div>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/scenes.js"></script>
<script src="js/codex.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
